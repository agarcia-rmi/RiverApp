<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>River Church Site Map</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,600&family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500&family=Cinzel:wght@600&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0d3045; --ink-soft:#535b67;
    --glass:rgba(249,247,242,0.86); --line:rgba(28,31,38,0.12);
    --accent:#d6a329; --navy:#0f3952; --gold:#d6a329;
    --shadow:0 14px 44px rgba(20,18,40,0.18), 0 2px 8px rgba(20,18,40,0.10);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;overflow:hidden;background:#0f3952;font-family:'Archivo',sans-serif;color:var(--ink);}
  #app{position:fixed;inset:0;background:radial-gradient(120% 90% at 70% 0%, #eef2f7 0%, #d7dde7 45%, #c4ccda 100%);}
  canvas{display:block;position:absolute;inset:0;touch-action:none;}

  #labels{position:absolute;inset:0;pointer-events:none;overflow:hidden;}
  .lab{position:absolute;transform:translate(-50%,-130%);font-weight:600;font-size:12.5px;letter-spacing:.2px;color:var(--ink);
    background:rgba(255,255,255,.92);padding:4px 9px;border-radius:20px;white-space:nowrap;
    box-shadow:0 4px 14px rgba(20,18,40,.16);border:1px solid rgba(255,255,255,.9);transition:opacity .18s ease;backdrop-filter:blur(4px);}
  .lab::after{content:"";position:absolute;left:50%;bottom:-5px;transform:translateX(-50%) rotate(45deg);
    width:8px;height:8px;background:rgba(255,255,255,.92);border-right:1px solid rgba(255,255,255,.9);border-bottom:1px solid rgba(255,255,255,.9);}
  .lab .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:1px;}

  #ftPin{position:absolute;z-index:7;pointer-events:auto;cursor:pointer;will-change:left,top;}
  #ftPin .pinInner{animation:bob 2.4s ease-in-out infinite;}
  #ftPin .pinBody{width:36px;height:36px;border-radius:50% 50% 50% 0;background:#d6a329;transform:rotate(-45deg);
    box-shadow:0 6px 13px rgba(20,18,40,.36);border:1.6px solid #fff;display:flex;align-items:center;justify-content:center;
    transition:transform .15s ease, background .15s ease;}
  #ftPin .pinIcon{transform:rotate(45deg);width:18px;height:18px;display:flex;}
  #ftPin .pinIcon svg{width:18px;height:18px;stroke:#5a4400;}
  #ftPin:hover .pinBody, #ftPin.active .pinBody{background:#e3c06d;transform:rotate(-45deg) scale(1.12);}
  @keyframes bob{0%,100%{transform:translateY(0);}50%{transform:translateY(-3px);}}
  /* occasional "click for list" hint bubble above the (bigger) vendor pin */
  #ftPin .ftHint{position:absolute;bottom:calc(100% + 7px);left:50%;white-space:nowrap;
    background:#fff;color:#1b2a3a;font:600 12px/1 -apple-system,system-ui,sans-serif;padding:7px 11px;border-radius:9px;
    box-shadow:0 6px 16px rgba(0,0,0,.28);opacity:0;pointer-events:none;
    transform:translateX(-50%) translateY(4px);animation:ftHintPulse 9s ease-in-out infinite;}
  #ftPin .ftHint::after{content:"";position:absolute;top:100%;left:50%;transform:translateX(-50%);border:6px solid transparent;border-top-color:#fff;}
  @keyframes ftHintPulse{0%,72%{opacity:0;transform:translateX(-50%) translateY(4px);}
    78%,93%{opacity:1;transform:translateX(-50%) translateY(0);}
    100%{opacity:0;transform:translateX(-50%) translateY(4px);}}

  /* amenity (filter) pins */
  #amenLayer{position:absolute;inset:0;pointer-events:none;overflow:hidden;}
  .amen{position:absolute;z-index:6;pointer-events:auto;cursor:pointer;}
  .amen-lbl{position:absolute;bottom:128%;left:50%;transform:translateX(-50%) scale(.88);transform-origin:bottom center;white-space:nowrap;background:#fff;color:#1b2a3a;font:600 11px/1 -apple-system,system-ui,sans-serif;padding:5px 9px;border-radius:8px;box-shadow:0 5px 14px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:opacity .15s ease, transform .15s ease;}
  .amen-lbl::after{content:"";position:absolute;top:100%;left:50%;transform:translateX(-50%);border:5px solid transparent;border-top-color:#fff;}
  .amen.show{z-index:20;}
  .amen.show .amen-lbl{opacity:1;transform:translateX(-50%) scale(1);}
  .amen .ab{width:22px;height:22px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:1.4px solid #fff;
    box-shadow:0 4px 9px rgba(20,18,40,.3);display:flex;align-items:center;justify-content:center;transition:transform .15s ease;}
  .amen:hover .ab{transform:rotate(-45deg) scale(1.16);}
  .amen .ai{transform:rotate(45deg);width:11px;height:11px;display:flex;}
  .amen .ai svg{width:11px;height:11px;}


  /* Pastoral Meet & Greet pins */
  #mgLayer{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:6;}
  .mgpin{position:absolute;pointer-events:auto;cursor:pointer;will-change:left,top;transform:translate(-50%,-100%);}
  .mgbody{display:flex;flex-direction:column;align-items:center;}
  .mgava{width:46px;height:46px;border-radius:50%;background:#3576c4;display:flex;align-items:center;justify-content:center;flex:none;position:relative;z-index:2;}
  .mgpic{width:38px;height:38px;border-radius:50%;background-size:cover;background-position:center;border:2px solid #fff;display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:700;font-family:'Archivo',sans-serif;}
  .mglabel{position:relative;z-index:1;margin-top:-13px;background:#3576c4;border-radius:13px;padding:15px 13px 5px;display:flex;flex-direction:column;align-items:center;box-shadow:0 4px 13px rgba(20,30,60,.4);}
  .mgname{color:#fff;font-size:12.5px;font-weight:700;white-space:nowrap;font-family:'Archivo',sans-serif;}
  .mgtime{color:#ffd98a;font-size:11.5px;font-weight:700;white-space:nowrap;font-family:'IBM Plex Mono',monospace;max-height:0;opacity:0;overflow:hidden;transition:max-height .2s ease,opacity .2s ease,margin-top .2s ease;}
  .mgpin.expanded{z-index:8;}
  .mgpin.expanded .mgtime{max-height:18px;opacity:1;margin-top:2px;}
  .mgpin::after{content:"";position:absolute;left:50%;bottom:-6px;width:0;height:0;transform:translateX(-50%);border-left:6px solid transparent;border-right:6px solid transparent;border-top:8px solid #3576c4;}
  /* the women's pins: the tonal twin of the men's blue (same saturation and lightness, pink hue) */
  .mgpin.fem .mgava,.mgpin.fem .mglabel{background:#c43571;}
  .mgpin.fem::after{border-top-color:#c43571;}
  @media (max-width:560px){ .mgname{font-size:11.5px;} .mgava{width:42px;height:42px;} .mgpic{width:34px;height:34px;} }

  /* filter drawer attached to the info card */
  #fHandle,#dHandle{position:absolute;right:calc(100% - 6px);transform:translateY(-50%);z-index:1;
    width:36px;height:54px;border-radius:15px 0 0 15px;background:var(--glass);backdrop-filter:blur(14px);color:var(--ink);
    border:1px solid var(--line);border-right:none;display:flex;align-items:center;justify-content:center;cursor:pointer;
    box-shadow:-9px 6px 18px rgba(20,18,40,.2);transition:background .15s ease;padding-right:6px;}
  #fHandle{top:calc(50% - 31px);}
  #dHandle{top:calc(50% + 31px);}
  #fHandle svg,#dHandle svg{width:19px;height:19px;}
  #fHandle:hover,#dHandle:hover{background:rgba(255,255,255,.95);}
  #infoWrap.fopen #fHandle{background:#fff;}
  #infoWrap.dopen #dHandle{background:#fff;}
  #fdrawer,#ddrawer{position:absolute;top:50%;right:100%;margin-right:42px;width:170px;
    background:var(--navy);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:9px;
    box-shadow:0 16px 46px rgba(12,28,52,.42);transform:translate(22px,-50%);opacity:0;pointer-events:none;
    transition:opacity .24s ease, transform .3s cubic-bezier(.2,.8,.2,1);}
  #infoWrap.fopen #fdrawer{opacity:1;transform:translate(0,-50%);pointer-events:auto;}
  #infoWrap.dopen #ddrawer{opacity:1;transform:translate(0,-50%);pointer-events:auto;}
  #fdrawer .fdHead,#ddrawer .fdHead{font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--gold);margin:1px 0 7px 6px;}
  .frow{display:flex;align-items:center;gap:8px;width:100%;border:0;background:transparent;cursor:pointer;padding:6px 7px;border-radius:10px;
    text-align:left;font-family:'Archivo',sans-serif;font-size:12px;font-weight:600;color:#eaf1fa;transition:background .15s ease;}
  .frow:hover{background:rgba(255,255,255,.10);}
  .frow .cdot{width:13px;height:13px;border-radius:4px;flex:0 0 auto;box-shadow:inset 0 0 0 1px rgba(255,255,255,.25);}
  .frow .tg{margin-left:auto;width:28px;height:16px;border-radius:9px;background:rgba(255,255,255,.22);position:relative;transition:background .18s ease;flex:0 0 auto;}
  .frow .tg::after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:#fff;transition:left .18s ease;box-shadow:0 1px 2px rgba(0,0,0,.3);}
  .frow.on .tg{background:#33ad5a;}
  .drow .cdot{width:20px;height:20px;border-radius:6px;}
  .dlab{display:flex;flex-direction:column;line-height:1.18;text-align:left;}
  .dlab small{font-size:11.5px;font-style:italic;font-weight:500;opacity:.82;margin-top:1px;}
  .frow.on .tg::after{left:14px;}

  #tools{position:absolute;top:18px;right:18px;z-index:10;display:flex;flex-direction:column;gap:9px;align-items:flex-end;animation:rise .7s .04s cubic-bezier(.2,.8,.2,1) both;}
  .btn{font-size:12.5px;font-weight:600;color:var(--ink);background:var(--glass);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:11px;
    padding:9px 14px;cursor:pointer;box-shadow:var(--shadow);transition:background .15s,color .15s,transform .12s;display:flex;align-items:center;gap:7px;}
  .btn:hover{transform:translateY(-1px);}
  .btn.on{background:var(--accent);color:#fff;border-color:transparent;}
  .btn svg{width:14px;height:14px;}

  /* ---- Schedule full-page modal (fire theme) ---- */
  #schedModal{position:fixed;inset:0;z-index:60;display:none;overflow-y:auto;-webkit-overflow-scrolling:touch;background:#092130;color:#fff;}
  #schedModal.open{display:block;animation:schedFade .3s ease both;}
  @keyframes schedFade{from{opacity:0}to{opacity:1}}
  /* ---- Pavilion Lobby full-page modal (reuses the schedule fire theme) ---- */
  #pavModal,#balModal{position:fixed;inset:0;z-index:60;display:none;overflow-y:auto;-webkit-overflow-scrolling:touch;background:#092130;color:#fff;}
  #pavModal.open,#balModal.open{display:block;animation:schedFade .3s ease both;}
  .pavSub{font-family:'IBM Plex Mono',monospace;color:rgba(240,214,150,.72);font-size:13px;letter-spacing:2px;text-transform:uppercase;margin:14px 0 0;}
  .pavBody{padding-top:6px;}
  .pavFrame{width:100%;border:0;border-radius:16px;background:#eef1ee;display:block;min-height:340px;margin:0 0 26px;
    box-shadow:0 22px 60px rgba(0,0,0,.5);border:1.5px solid rgba(255,150,90,.28);}
  /* ---- Food & Vendors full-page modal (reuses the schedule fire theme) ---- */
  #vendorModal{position:fixed;inset:0;z-index:60;display:none;overflow-y:auto;-webkit-overflow-scrolling:touch;background:#092130;color:#fff;}
  #vendorModal.open{display:block;animation:schedFade .3s ease both;}
  .vendCat{font-family:'IBM Plex Mono',monospace;font-size:14px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:#e8c77a;margin:0 0 6px;padding:2px;}
  .vRow{display:flex;align-items:baseline;justify-content:space-between;gap:16px;padding:13px 4px;border-bottom:1px solid rgba(255,180,140,.12);}
  .vRow:last-child{border-bottom:none;}
  .vName{font-family:'Archivo',sans-serif;font-weight:700;font-size:16px;color:#fff;}
  .vCuisine{font-family:'IBM Plex Mono',monospace;font-size:13.5px;color:#e8c77a;white-space:nowrap;letter-spacing:.5px;}

  .schedBg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg, rgba(8,4,7,.74) 0%, rgba(10,4,8,.82) 45%, rgba(8,3,6,.9) 100%);}
  .schedClose{position:fixed;top:16px;right:16px;z-index:5;width:46px;height:46px;border-radius:50%;border:1px solid rgba(255,150,90,.4);
    background:rgba(20,8,10,.5);color:#fff;font-size:26px;line-height:1;display:flex;align-items:center;justify-content:center;
    cursor:pointer;backdrop-filter:blur(8px);transition:background .15s,transform .12s,border-color .15s;-webkit-tap-highlight-color:transparent;}
  .schedClose:hover{background:rgba(255,120,60,.3);border-color:rgba(255,170,110,.7);transform:scale(1.06);}
  .schedSheet{position:relative;z-index:1;max-width:840px;margin:0 auto;min-height:100%;padding:0 20px 76px;}
  .schedHead{padding:62px 8px 30px;text-align:center;}
  .schedTitle{font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:clamp(30px,5.5vw,44px);line-height:1.06;margin:0;text-shadow:0 2px 30px rgba(255,90,40,.35);}
  .schedRule{width:84px;height:3px;border-radius:3px;margin:18px auto 0;background:linear-gradient(90deg,#d6a329,#e8c77a);box-shadow:0 0 16px rgba(255,110,50,.6);}
  .schedBody{padding-top:6px;}
  .schedSec{position:relative;border-radius:20px;padding:16px;margin:0 0 26px;overflow:hidden;border:1.5px solid transparent;
    background:linear-gradient(rgba(16,9,12,.62),rgba(16,9,12,.62)) padding-box, linear-gradient(135deg,#d6a329 0%,#e8c77a 42%,#3f6fb0 100%) border-box;
    box-shadow:0 22px 60px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.05);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);}
  .secImg{width:100%;height:auto;display:block;border-radius:13px;margin:0 0 16px;box-shadow:0 6px 20px rgba(0,0,0,.4);}
  .secMeta{font-family:'IBM Plex Mono',monospace;color:#e8c77a;font-size:13px;letter-spacing:1.5px;margin:0 0 2px;}
  .secMetaSub{font-family:'IBM Plex Mono',monospace;color:rgba(255,255,255,.6);font-size:12px;letter-spacing:1.5px;margin:0 0 12px;}
  .subHead{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:rgba(240,214,150,.72);margin:20px 0 4px;}
  .dayPart{display:flex;align-items:center;gap:8px;font-family:'Archivo',sans-serif;font-size:14px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:#e8c77a;margin:16px 0 6px;}
  .dayPart svg{width:17px;height:17px;flex:none;}
  .schedRow{display:flex;gap:18px;align-items:baseline;padding:13px 4px;border-bottom:1px solid rgba(255,180,140,.12);}

      var el=document.createElement('div'); el.className='mgpin'+(FEM[name]?' fem':'');
      el.innerHTML='<div class="mgbody"><div class="mgava"><div class="mgpic" style="'+avStyle+'">'+(PICS[name]?'':short.slice(0,2))+'</div></div>'+
        '<div class="mglabel"><div class="mgname">'+name+'</div><div class="mgtime">'+(moving?0:wait)+' minutes</div></div></div>';
      layer.appendChild(el);
      var timeEl=el.querySelector('.mgtime');
      var hideTimer=null;
      el.addEventListener('click', function(e){ e.stopPropagation();
        mgZTop++; el.style.zIndex=mgZTop;                                // raise the clicked pin above all others
        if(el.classList.contains('expanded')){ el.classList.remove('expanded'); clearTimeout(hideTimer); return; }
        el.classList.add('expanded');                                   // expand the pill to reveal the wait time
        clearTimeout(hideTimer);
        hideTimer=setTimeout(function(){ el.classList.remove('expanded'); }, 5000);   // auto-collapse after 5s
      });
      el.addEventListener('pointerdown', function(e){ e.stopPropagation(); });
      pins.push({el:el,timeEl:timeEl,name:name,x:pos.x,z:pos.z,y:0.6,node:zi,zone:zone,state:'dwell',rodney:(name==='Pastor Rodney'),
                 moving:moving,wait:wait,head:Math.random()*Math.PI*2,dwellT:10+Math.random()*16,dest:zi,path:null,travelSpd:1.0});
    });

    window.updateMG=function(dt){
      var i,o;
      for(i=0;i<pins.length;i++){ o=pins[i];
        if(o.state==='travel'){                                                   // strolling to another area
          var tgt=o.path&&o.path[0];
          if(!tgt){ o.state='dwell'; o.node=o.dest; o.zone=ZONES[o.dest]; o.moving=false; o.dwellT=12+Math.random()*22; continue; }
          var dx=tgt.x-o.x, dz=tgt.z-o.z, d=Math.sqrt(dx*dx+dz*dz);
          if(d<1.2){ o.x=tgt.x; o.z=tgt.z; o.path.shift();
            if(o.path.length===0){ o.state='dwell'; o.node=o.dest; o.zone=ZONES[o.dest];   // arrived in the new area
              o.moving=false; o.wait=(Math.floor(Math.random()*6)+1)*5; o.dwellT=12+Math.random()*22;
              o.timeEl.textContent=o.wait+' minutes'; } }
          else { o.x+=dx/d*o.travelSpd*dt; o.z+=dz/d*o.travelSpd*dt; }
          continue;
        }
        // dwelling in an area
        o.dwellT-=dt;
        if(o.moving){ o.head+=(Math.random()-0.5)*0.05; var spd=0.7;                // gentle wander within the zone
          o.x+=Math.cos(o.head)*spd*dt; o.z+=Math.sin(o.head)*spd*dt; clampToZone(o); }
        if(o.dwellT<=0){
          if(!o.rodney && o.wait===5 && Math.random()<0.6){                          // only 5-minute pins set off to another area
            var opts=[], zz;
            for(zz=0; zz<ZONES.length; zz++){
              if(zz===o.node) continue;
              if(!mayEnter(o.name,zz)) continue;                                       // full, or not invited
              opts.push(zz);
            }
            if(opts.length){
              var dest=opts[Math.floor(Math.random()*opts.length)];
              occ[o.node]--; occ[dest]++;                                              // free the old slot, hold the new one for the whole walk
              o.dest=dest; o.path=routeTo(o.node,dest); o.state='travel'; o.moving=false;
              o.timeEl.textContent='0 minutes';
            }
          } else {                                                                   // linger: re-roll wander/wait (as before)
            if(o.moving){ if(Math.random()<0.5){ o.moving=false; o.wait=(Math.floor(Math.random()*6)+1)*5; } }
            else if(o.wait===5 && Math.random()<0.6){ o.moving=true; o.head=Math.random()*Math.PI*2; }
            else { o.wait=(Math.floor(Math.random()*6)+1)*5; }
            o.dwellT=10+Math.random()*16; o.timeEl.textContent=(o.moving?0:o.wait)+' minutes';
          }
        }
      }
      for(i=0;i<pins.length;i++){ o=pins[i]; if(o.state!=='dwell'||!o.moving) continue;   // gentle separation among minglers
        for(var j=0;j<pins.length;j++){ if(j===i) continue; var p=pins[j];
          var ddx=o.x-p.x, ddz=o.z-p.z, d2=ddx*ddx+ddz*ddz;
          if(d2<25 && d2>1e-4){ var dd=Math.sqrt(d2); o.x+=(ddx/dd)*(5-dd)*1.5*dt; o.z+=(ddz/dd)*(5-dd)*1.5*dt; } }
      }
      for(i=0;i<pins.length;i++){ o=pins[i]; avoidObstacles(o);                       // keep clear of off-limit grass/brackets, then project
        mv.set(o.x,o.y,o.z).project(camera);
        if(mv.z>1){ o.el.style.display='none'; continue; }
        o.el.style.display='block';
        o.el.style.left=((mv.x*0.5+0.5)*window.innerWidth)+'px';
        o.el.style.top=((-mv.y*0.5+0.5)*window.innerHeight)+'px';
      }
    };
  })();

  /* Meet & Greet on/off toggle (off by default) */
  (function(){ var mgBtn=document.getElementById('mgBtn'), on=false;
    var mgLayer=document.getElementById('mgLayer'); mgLayer.style.display='none';
    mgBtn.addEventListener('click', function(){ on=!on; mgOn=on; dirty=true;
      mgLayer.style.display = on?'':'none';
      mgBtn.classList.toggle('on', on);
      if(on) overheadView(1.0);                                                 // exactly the View button's overhead framing
    });
  })();

  window.MapAPI = { setRoute:setRoute, setNight:setNight, selectNone:selectNone, VENDORS:VENDORS, openPavModal:openPavModal, goPanning:goPanning, setDirFrom:setDirFrom, getDirFrom:function(){return dirFrom;}, setRenderOn:setRenderOn };

})();
</script>

    var BAL_LAYOUT_HTML = "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>Main Sanctuary Balcony Layout<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link href=\"https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap\" rel=\"stylesheet\">\n<style>\n  :root{\n    --bg:#eef1ee;            /* white field where the title sits, matching the pavilion lobby graphic */\n    --plate:#e9f2fc;         /* very light blue field the plan sits on (lighter than the Men's Restroom) */\n    --plate-edge:#c3d6ea;\n    --ink:#16202b;\n    --paper:#eef1f6;\n    --gold:#dbae43;\n    --women:#d76ba3;\n    --men:#6f9bd1;\n    --nursery:#f5a9bb;      /* soft pink */\n    --overflow:var(--nursing);   /* locked to the Mother's Room green */\n    --nursing:#8fc978;\n    --lobby:#64818c;\n    --balcony:#243463;   /* standard app gold */\n    --stair:#9aa7b4;\n    --elev:#4b3f8f;          /* same purple as the map's elevator pins */\n    --void:#e9f2fc;          /* first-floor field, same light tone as the walkways between the balconies */\n  }\n  *{box-sizing:border-box}\n  html,body{margin:0;padding:0}\n  body{\n    background:var(--bg);\n    color:var(--paper);\n    font-family:'Inter',system-ui,sans-serif;\n    padding:18px 16px 24px;\n    display:flex;flex-direction:column;align-items:center;\n  }\n  .wrap{width:100%;max-width:600px}\n  header{margin:0 4px 10px}\n  h1{\n    font-family:'Barlow Condensed',sans-serif;\n    font-weight:700;letter-spacing:.02em;text-transform:uppercase;\n    font-size:clamp(22px,4vw,30px);margin:0;line-height:1;color:var(--ink);\n  }\n  .lede{color:var(--gold);font-size:11px;letter-spacing:2px;text-transform:uppercase;\n    font-family:'IBM Plex Mono',ui-monospace,monospace;margin:6px 4px 0}\n  svg{display:block;width:100%;height:auto}\n  .elevG{cursor:pointer}\n  .elevTip{opacity:0;transition:opacity .15s ease;pointer-events:none}\n  .elevG:hover .elevTip,.elevG.on .elevTip{opacity:1}\n<\/style>\n<\/head>\n<body>\n<div class=\"wrap\">\n\n  <svg id=\"map\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"\n       aria-label=\"Second level plan: north, south and west balconies, nurseries, restrooms and walkway\">\n    <defs>\n      <filter id=\"soft\" x=\"-20%\" y=\"-20%\" width=\"140%\" height=\"140%\">\n        <feDropShadow dx=\"0\" dy=\"3\" stdDeviation=\"4\" flood-color=\"#060c1e\" flood-opacity=\"0.42\"/>\n      <\/filter>\n      <filter id=\"plateShadow\" x=\"-6%\" y=\"-6%\" width=\"112%\" height=\"112%\">\n        <feDropShadow dx=\"0\" dy=\"10\" stdDeviation=\"16\" flood-color=\"#060c1e\" flood-opacity=\"0.5\"/>\n      <\/filter>\n      <pattern id=\"stairHatch\" width=\"9\" height=\"9\" patternUnits=\"userSpaceOnUse\">\n        <rect width=\"9\" height=\"9\" fill=\"#9aa7b4\"/>\n        <line x1=\"0\" y1=\"0\" x2=\"0\" y2=\"9\" stroke=\"#5d6b78\" stroke-width=\"3\"/>\n      <\/pattern>\n    <\/defs>\n    <g id=\"plate\"><\/g>\n    <g id=\"walk\"><\/g>\n    <g id=\"floor1\"><\/g>\n    <g id=\"balconies\"><\/g>\n    <g id=\"rooms\"><\/g>\n    <g id=\"doors\"><\/g>\n    <g id=\"labels\"><\/g>\n  <\/svg>\n<\/div>\n\n<script>\n/* ============================================================================\n   2ND-LEVEL PLAN\n   ----------------------------------------------------------------------------\n   Boxes are {x, y, w, h} in plan units. Y is compressed by YS when drawn, which\n   squares the image up without moving anything relative to anything else.\n   The walkway keeps a constant WALK_W on screen: vertical runs are WALK_W wide\n   in x, horizontal runs are WALK_W/YS tall in y so they land at the same width.\n   ============================================================================ */\n\nconst YS = 0.71;          /* vertical compression (keeps the taller plan near-square) */\nconst WALK_W = 48;        /* on-screen walkway width */\nconst PAD = 0;            /* the plate hugs the drawing exactly */\nconst WP = WALK_W / YS;   /* plan-unit thickness of a horizontal walkway run */\n\n/* the three balcony decks */\nconst BALCONIES = [\n  { name:['NORTH','BALCONY'], x:780, y:130,  w:370, h:380 },\n  { name:['SOUTH','BALCONY'], x:780, y:1244, w:370, h:380 },\n  { name:['WEST','BALCONY'],  x:275, y:677,  w:365, h:400 }\n];\n\n/* the gray walkway has been removed; the doors now carry the circulation */\nconst WALKWAY = [];\n\n/* colour-keyed rooms. The Main Nursery and the Family Room / Nursing Mother's\n   suite are the same footprint (355 x 341) and both run to the balcony edges. */\nconst ROOMS = [\n  { name:[\"MEN'S\",'RESTROOM'],   x:155, y:240,  w:205, h:150, fill:'var(--men)',   size:30 },\n  { name:[\"WOMEN'S\",'RESTROOM'], x:155, y:395,  w:205, h:160, fill:'var(--women)', size:30 },\n  { name:[\"WOMEN'S\",'RESTROOM'], x:155, y:1199, w:205, h:160, fill:'var(--women)', size:30 },\n  { name:[\"MEN'S\",'RESTROOM'],   x:155, y:1364, w:205, h:150, fill:'var(--men)',   size:30 },\n  { name:['NURSERY'],        x:485, y:336,  w:295, h:341, fill:'var(--nursery)',  size:46 },\n  { name:[\"PARENTS'\",'ROOM'], x:485, y:1077, w:225, h:341, fill:'var(--overflow)', size:44 },\n  /* narrow strip, so the label is turned to run down it */\n  { name:[\"MOTHER'S ROOM\"],  x:715, y:1077, w:65,  h:341, fill:'var(--nursing)',  size:26, rot:true },\n  { name:[], x:690, y:130,  w:90, h:110, fill:'var(--elev)', icon:'elevator' },\n  { name:[], x:690, y:1514, w:90, h:110, fill:'var(--elev)', icon:'elevator' }\n];\n\n/* stair runs, top and bottom */\nconst STAIRS = [\n  { name:['STAIRS'], x:155, y:130,  w:415, h:110, size:34 },\n  { name:['STAIRS'], x:155, y:1514, w:415, h:110, size:34 }\n];\n\n/* the corridor has been removed; the doors carry the circulation */\nconst CORRIDORS = [];\n/* ========================= end of editable values ========================= */\n\nconst NS='http://www.w3.org/2000/svg';\nfunction el(tag,a,p){ const n=document.createElementNS(NS,tag);\n  for(const k in a) n.setAttribute(k,a[k]); if(p) p.appendChild(n); return n; }\n\n/* squash a box into drawing space */\nfunction S(b){\n  const o=Object.assign({},b,{y:b.y*YS, h:b.h*YS});\n  if(b.out) o.out={x:b.out.x, y:b.out.y*YS};\n  return o;\n}\nconst BAL=BALCONIES.map(S), WALK=WALKWAY.map(S), RMS=ROOMS.map(S), STR=STAIRS.map(S), COR=CORRIDORS.map(S);\n\n/* double doors, in drawing space so the swing arcs stay circular.\n   a/b are the two jambs of the opening; dir points into the space they open into. */\nconst DOORS = [\n  { a:[780, 256*YS],  b:[780, 320*YS],  dir:[ 1, 0], color:'var(--plate)' },  /* centred in the north walkway */\n  { a:[780, 1434*YS], b:[780, 1498*YS], dir:[ 1, 0], color:'var(--plate)' },  /* centred in the south walkway */\n  { a:[600, 240*YS],  b:[660, 240*YS],  dir:[ 0, 1], color:'var(--ink)'   },  /* centred between stairs and lift */\n  { a:[600, 1514*YS], b:[660, 1514*YS], dir:[ 0,-1], color:'var(--ink)'   },  /* centred between stairs and lift */\n  { a:[405, 677*YS],  b:[465, 677*YS],  dir:[ 0, 1], color:'var(--plate)' },  /* west of the Nursery -> into the West Balcony */\n  { a:[405, 1077*YS], b:[465, 1077*YS], dir:[ 0,-1], color:'var(--plate)' }   /* west of Parents' Rm -> into the West Balcony */\n];\n\n/* the indoor envelope: one line round the outside of everything, leaving the stairs\n   and the lifts outside it, and broken where each door opening sits */\nconst INDOOR = [\n  [[155,240],[600,240]],\n  [[660,240],[780,240],[780,130],[1150,130],[1150,1624],[780,1624],[780,1514],[660,1514]],\n  [[600,1514],[155,1514],[155,240]]\n];\n\n/* The open space through the middle, as one piece: the slot between the Nursery and the\n   Parents'/Mother's rooms, opening out into the void between the two balconies. */\nconst MIDDLE = [[640,677],[780,677],[780,510],[1150,510],[1150,1244],[780,1244],[780,1077],[640,1077]];\n\n/* ---- fit the plate and the viewBox to the drawing ---- */\nconst ALL=[...BAL,...WALK,...RMS,...STR,...COR];\nconst bx0=Math.min(...ALL.map(b=>b.x)), bx1=Math.max(...ALL.map(b=>b.x+b.w));\nconst by0=Math.min(...ALL.map(b=>b.y)), by1=Math.max(...ALL.map(b=>b.y+b.h));\nconst PLATE={ x:bx0-PAD, y:by0-PAD, w:(bx1-bx0)+PAD*2, h:(by1-by0)+PAD*2 };\ndocument.getElementById('map').setAttribute('viewBox',\n  `${PLATE.x-3} ${PLATE.y-3} ${PLATE.w+6} ${PLATE.h+6}`);   /* just enough for the plate stroke */\n\n/* horizontal, centred, multi-line label */\nfunction label(b,size,fill){\n  const g=document.getElementById('labels');\n  if(!b.name || !b.name.length) return;\n  if(b.out){\n    el('line',{x1:b.x+b.w, y1:b.out.y, x2:b.out.x-10, y2:b.out.y,\n      stroke:'rgba(22,32,43,.55)','stroke-width':2.5},g);\n    const t=el('text',{x:b.out.x, y:b.out.y, 'dominant-baseline':'middle',\n      'font-family':'Barlow Condensed, sans-serif','font-size':size,'font-weight':700,\n      'letter-spacing':'0.04em', fill:'var(--paper)'},g);\n    t.textContent=b.name.join(' ');\n    return;\n  }\n  const lh=size+4, top=b.y+b.h/2-((b.name.length-1)*lh)/2;\n  b.name.forEach((ln,i)=>{\n    const cx=b.x+b.w/2, cy=top+lh*i;\n    const at={x:cx, y:cy, 'text-anchor':'middle','dominant-baseline':'middle',\n      'font-family':'Barlow Condensed, sans-serif','font-size':size,'font-weight':700,\n      'letter-spacing':'0.04em', fill:fill};\n    if(b.rot) at.transform=`rotate(90 ${cx} ${cy})`;\n    const t=el('text',at,g);\n    t.textContent=ln;\n  });\n}\n\n/* ---- plate ---- */\nel('rect',{x:PLATE.x,y:PLATE.y,width:PLATE.w,height:PLATE.h,rx:18,\n  fill:'var(--plate)',stroke:'var(--plate-edge)','stroke-width':2.5,filter:'url(#plateShadow)'},\n  document.getElementById('plate'));\n\n/* ---- walkway ---- */\n(function(){\n  const g=document.getElementById('walk');\n  el('path',{d:MIDDLE.map((pt,i)=>(i?'L':'M')+pt[0]+' '+(pt[1]*YS)).join(' ')+' Z',\n    fill:'var(--void)'},g);\n  INDOOR.forEach(run=>{\n    const d=run.map((pt,i)=>(i?'L':'M')+pt[0]+' '+(pt[1]*YS)).join(' ');\n    el('path',{d, fill:'none', stroke:'#667085','stroke-width':3.5,\n      'stroke-linejoin':'miter','stroke-linecap':'square'},g);\n  });\n})();\n\n/* ---- balconies ---- */\n/* ---- first floor seen through the void: stage + auditorium seating (one path per colour) ---- */\n(function(){\n  const g=document.getElementById('floor1'); if(!g) return;\n  const cp=el('clipPath',{id:'auditClip'},g);                         /* just the void: the balcony decks sit on top of it */\n  el('path',{d:MIDDLE.map((p,i)=>(i?'L':'M')+p[0]+' '+(p[1]*YS)).join(' ')+' Z'},cp);\n  const layer=el('g',{'clip-path':'url(#auditClip)'},g);\n\n  const SX=1150, SY=877*YS, RX=118, RY=196;                           /* stage: half-ellipse, long north-south */\n  el('path',{d:'M '+SX+' '+(SY-RY)+' A '+RX+' '+RY+' 0 0 0 '+SX+' '+(SY+RY)+' Z',\n    fill:'var(--balcony)','fill-opacity':.9,stroke:'rgba(22,32,43,.35)','stroke-width':2},layer);\n\n  /* a point d away from the stage edge along the outward normal: even clearance the whole way round */\n  function sp(t,d){\n    const c=Math.cos(t), s=Math.sin(t);\n    let nx=c/RX, ny=s/RY; const L=Math.hypot(nx,ny); nx/=L; ny/=L;\n    return {x:SX+RX*c+d*nx, y:SY+RY*s+d*ny, nx:nx, ny:ny};\n  }\n  function cum(ta,tb,d,N){                                            /* walk a row and record how far along we are */\n    const ts=[ta], ss=[0]; let ln=0, p=sp(ta,d), px=p.x, py=p.y;\n    for(let i=1;i<=N;i++){\n      const t=ta+(tb-ta)*i/N, q=sp(t,d);\n      ln+=Math.hypot(q.x-px,q.y-py); px=q.x; py=q.y; ts.push(t); ss.push(ln);\n    }\n    return {ts:ts, ss:ss, len:ln};\n  }\n  function mix(a,b){                                                  /* scatter the seat colours properly (a plain a*x^b*y bands up) */\n    let x=(Math.imul(a,374761393)+Math.imul(b,668265263))|0;\n    x=Math.imul(x^(x>>>13),1274126177);\n    return (x^(x>>>16))>>>0;\n  }\n  function tAt(c,s){\n    let j=1; while(j<c.ss.length-1 && c.ss[j]<s) j++;\n    const f=(s-c.ss[j-1])/((c.ss[j]-c.ss[j-1])||1);\n    return c.ts[j-1]+(c.ts[j]-c.ts[j-1])*f;\n  }\n\n  const T0=Math.PI/2, T1=Math.PI*1.5;\n  const CLEAR=55, ROWGAP=16, ROWS=23, AISLE=28, FIRST=[12,13,12];     /* front row: 12 | 13 | 12 */\n  const base=cum(T0,T1,CLEAR,3000);\n  const PITCH=(base.len-2*AISLE)/(FIRST[0]+FIRST[1]+FIRST[2]);        /* one seat size everywhere */\n  const SW=PITCH-1.3, SH=ROWGAP-1.3;\n  const e1=FIRST[0]*PITCH, e2=e1+AISLE, e3=e2+FIRST[1]*PITCH, e4=e3+AISLE;\n  const BLOCKS=[[T0,tAt(base,e1)],[tAt(base,e2),tAt(base,e3)],[tAt(base,e4),T1]];   /* aisles are fixed angles -> dead straight */\n  const HUES=['#1d3663','#6f9ad2'], D=['',''];\n  const X0=632, Y0=352, Y1=892;                                       /* void bounds: skip seats that could never be seen */\n\n  for(let r=0;r<ROWS;r++){\n    const d=CLEAR+r*ROWGAP;\n    for(let b=0;b<BLOCKS.length;b++){\n      const c2=cum(BLOCKS[b][0],BLOCKS[b][1],d,160), usable=c2.len-SW;\n      if(usable<=0) continue;\n      const n=(r===0) ? FIRST[b] : Math.max(2, Math.round(usable/PITCH)+1);\n      for(let k=0;k<n;k++){\n        if(r===0 && b===1 && k===(n-1)/2) continue;                   /* front row: middle seat left open */\n        const p=sp(tAt(c2, SW/2+usable*k/(n-1)), d);                  /* end seats sit flush on the aisle */\n        if(p.x<X0 || p.y<Y0 || p.y>Y1) continue;\n        const ax=-p.ny*SW/2, ay=p.nx*SW/2, bx=p.nx*SH/2, by=p.ny*SH/2;\n        D[mix(r,k)%2] +=\n          'M'+(p.x-ax-bx).toFixed(1)+' '+(p.y-ay-by).toFixed(1)+\n          'L'+(p.x+ax-bx).toFixed(1)+' '+(p.y+ay-by).toFixed(1)+\n          'L'+(p.x+ax+bx).toFixed(1)+' '+(p.y+ay+by).toFixed(1)+\n          'L'+(p.x-ax+bx).toFixed(1)+' '+(p.y-ay+by).toFixed(1)+'Z';\n      }\n    }\n  }\n  for(let i=0;i<2;i++){ if(D[i]) el('path',{d:D[i],fill:HUES[i]},layer); }\n})();\n\n(function(){\n  const g=document.getElementById('balconies');\n  BAL.forEach(b=>{\n    el('rect',{x:b.x,y:b.y,width:b.w,height:b.h,rx:8,fill:'var(--balcony)',\n      'fill-opacity':1,stroke:'rgba(22,32,43,.32)','stroke-width':2,filter:'url(#soft)'},g);\n    label(b,42,'#ffffff');   /* standard app navy blue */\n  });\n})();\n\n/* ---- stairs + rooms ---- */\n(function(){\n  const g=document.getElementById('rooms');\n  STR.forEach(s=>{\n    el('rect',{x:s.x,y:s.y,width:s.w,height:s.h,rx:3,\n      fill:'url(#stairHatch)',stroke:'rgba(22,32,43,.32)','stroke-width':1.6},g);\n    label(s, s.size||30, 'var(--ink)');\n  });\n  RMS.forEach(r=>{\n    const host = (r.icon==='elevator') ? el('g',{class:'elevG'},g) : g;\n    el('rect',{x:r.x,y:r.y,width:r.w,height:r.h,rx:5,fill:r.fill,\n      stroke:'rgba(22,32,43,.32)','stroke-width':2,filter:'url(#soft)'},host);\n    label(r,r.size||22,r.ink||'var(--ink)');\n    if(r.icon==='elevator'){                                   /* the map's elevator glyph */\n      const s=Math.min(r.w,r.h)*0.55/24;\n      const gg=el('g',{transform:`translate(${r.x+r.w/2-12*s} ${r.y+r.h/2-12*s}) scale(${s})`},host);\n      el('path',{d:'M12 2l5 6.5H7z',  fill:'#ffffff'},gg);\n      el('path',{d:'M12 22l-5-6.5h10z',fill:'#ffffff'},gg);\n      const ti=el('title',{},host); ti.textContent='Elevator';\n      const tw=104, th=30, tx=r.x-8-tw, ty=r.y+r.h/2-th/2;     /* chip sits west of the shaft */\n      const tip=el('g',{class:'elevTip'},host);\n      el('rect',{x:tx,y:ty,width:tw,height:th,rx:8,fill:'var(--ink)','fill-opacity':.94},tip);\n      const tt=el('text',{x:tx+tw/2,y:ty+th/2,'text-anchor':'middle','dominant-baseline':'middle',\n        'font-family':'Barlow Condensed, sans-serif','font-size':20,'font-weight':700,\n        'letter-spacing':'0.08em',fill:'#ffffff'},tip);\n      tt.textContent='ELEVATOR';\n      host.addEventListener('click',()=>host.classList.toggle('on'));\n    }\n  });\n})();\n\n/* ---- double doors, drawn the way a blueprint shows them: leaf plus swing arc ---- */\n(function(){\n  const g=document.getElementById('doors');\n  DOORS.forEach(d=>{\n    const mx=(d.a[0]+d.b[0])/2, my=(d.a[1]+d.b[1])/2;\n    const L=Math.hypot(d.b[0]-d.a[0], d.b[1]-d.a[1])/2;\n    [d.a, d.b].forEach(H=>{\n      const tx=H[0]+d.dir[0]*L, ty=H[1]+d.dir[1]*L;\n      el('line',{x1:H[0],y1:H[1],x2:tx,y2:ty,stroke:d.color,\n        'stroke-width':3.4,'stroke-linecap':'round'},g);                   /* the leaf */\n      const v1x=tx-H[0], v1y=ty-H[1], v2x=mx-H[0], v2y=my-H[1];\n      const sweep=(v1x*v2y - v1y*v2x) > 0 ? 1 : 0;\n      el('path',{d:`M ${tx} ${ty} A ${L} ${L} 0 0 ${sweep} ${mx} ${my}`,\n        fill:'none',stroke:d.color,'stroke-width':1.5,'stroke-opacity':.75},g);  /* the swing */\n    });\n  });\n})();\n\n<\/script>\n<\/body>\n<\/html>\n";
    var f = document.getElementById("balFrame");
    if(!f) return;
    function sizeFrame(){
      try{ var d=f.contentDocument||f.contentWindow.document;
        var h=Math.max(d.documentElement.scrollHeight, d.body?d.body.scrollHeight:0);
        if(h>0) f.style.height=h+"px"; }catch(e){}
    }
    f.addEventListener("load", function(){ sizeFrame(); setTimeout(sizeFrame,120); setTimeout(sizeFrame,400); });
    f.srcdoc = BAL_LAYOUT_HTML;
    window.addEventListener("resize", sizeFrame);
    var bm=document.getElementById("balModal");
    if(bm && window.MutationObserver){
      new MutationObserver(function(){ if(bm.classList.contains("open")){ sizeFrame(); setTimeout(sizeFrame,140); } })
        .observe(bm,{attributes:true,attributeFilter:["class"]});
    }
  })();
</script>
<script>
  // no app shell here, so kick off the opening fly once the map has loaded
  window.addEventListener("load", function(){
    if (window.MapAPI && window.MapAPI.goPanning) window.MapAPI.goPanning();
  });
</script>
